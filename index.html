<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>사장님AI</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f7fb;color:#171717}.wrap{max-width:1050px;margin:auto;padding:24px}.nav{display:flex;justify-content:space-between;align-items:center}.logo{font-size:24px;font-weight:900}.logo b{color:#6847ed}.hero{text-align:center;padding:65px 10px 38px}.hero h1{font-size:43px;line-height:1.2;margin:10px}.hero span{color:#6847ed}.hero p{color:#666}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:white;border:1px solid #e7e7ef;border-radius:20px;padding:24px;box-shadow:0 10px 35px #0000000a}label{display:block;font-weight:700;margin:14px 0 7px}input,select,textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:11px;font-size:15px}textarea{height:95px}.drop{margin-top:15px;border:2px dashed #ccc;border-radius:14px;padding:30px;text-align:center}.btn{width:100%;padding:15px;border:0;border-radius:12px;background:#6847ed;color:white;font-size:16px;font-weight:800;margin-top:18px}.preview{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ad{aspect-ratio:1/1;border-radius:15px;padding:18px;display:flex;align-items:end;font-size:22px;font-weight:900;background:linear-gradient(145deg,#ffd8df,#fff1d6)}.ad:nth-child(2){background:linear-gradient(145deg,#d9eaff,#efe2ff)}.result{margin-top:14px;padding:15px;background:#f7f5ff;border-radius:12px;white-space:pre-wrap}.prices{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:28px 0}.price{text-align:center;background:white;border:1px solid #e7e7ef;border-radius:15px;padding:18px}.price b{font-size:22px}@media(max-width:720px){.grid,.prices{grid-template-columns:1fr}.hero h1{font-size:32px}.preview{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><nav class="nav"><div class="logo">🏪 사장님<b>AI</b></div><div>광고 콘텐츠 자동 제작</div></nav><section class="hero"><h1>가게 사진, 그냥 올리기만 하세요<br><span>AI가 광고 콘텐츠를 만들어드립니다</span></h1><p>사진과 홍보 내용을 넣으면 광고 시안·SNS 문구·해시태그를 한 번에.</p></section><div class="grid"><section class="card"><h2>광고 만들기</h2><label>가게 이름</label><input id="name" placeholder="예: 카페 봄날"><label>업종</label><select id="type"><option>카페</option><option>음식점</option><option>미용실</option><option>헬스장</option><option>쇼핑몰</option><option>기타</option></select><label>홍보 내용</label><textarea id="promo" placeholder="예: 신메뉴 딸기라떼 출시, 이번 주 10% 할인"></textarea><label>원하는 분위기</label><select id="tone"><option>감성적인</option><option>깔끔한</option><option>고급스러운</option><option>재미있는</option></select><div class="drop">📷<br><b>사진 업로드</b><br><input id="photo" type="file" accept="image/*" style="margin-top:10px"></div><button class="btn" onclick="makeAd()">✨ 무료 광고 시안 만들기</button></section><section class="card"><h2>광고 결과 미리보기</h2><div class="preview"><div class="ad" id="a1">사진 한 장이<br>광고가 됩니다.</div><div class="ad" id="a2">오늘의 가게를<br>더 돋보이게.</div></div><div class="result" id="result">정보를 입력하면 SNS 홍보문구와 해시태그가 여기에 생성됩니다.</div></section></div><div class="prices"><div class="price">무료 체험<br><b>0원</b><br>시안 1개</div><div class="price">베이직<br><b>9,900원</b><br>이미지 5장</div><div class="price">프리미엄<br><b>19,900원</b><br>이미지+문구</div><div class="price">비즈니스<br><b>39,900원</b><br>이미지+숏폼</div></div></div><script>const photo=document.getElementById('photo');photo.onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);for(const id of ['a1','a2']){const x=document.getElementById(id);x.style.background='linear-gradient(#0003,#0008),url('+u+') center/cover';x.style.color='white'}};function makeAd(){const n=document.getElementById('name').value||'우리 가게',p=document.getElementById('promo').value||'오늘의 특별한 소식',t=document.getElementById('tone').value;document.getElementById('a1').innerText=n+'\n'+p;document.getElementById('a2').innerText=t+' 하루,\n'+n;document.getElementById('result').innerText='📣 '+n+'에서 알려드려요!\n\n'+p+'\n\n지금 방문해서 만나보세요.\n\n#'+n.replace(/\s/g,'')+' #동네가게 #오늘의추천 #이벤트';}</script></body></html>
